# Signs every source/*.xml via the HubSign signing server, then commits the
# signed .shortcut files back into shortcuts/.
#
# Trigger: Actions tab -> "Sign Shortcuts (HubSign)" -> Run workflow
#
# Note: the signing endpoint serves API clients (curl default User-Agent)
# normally; it may redirect/reject browser-like clients. We fall back to an
# empty User-Agent if the first attempt fails.
name: Sign Shortcuts (HubSign)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sign sources
        run: |
          mkdir -p shortcuts
          for f in source/*.xml; do
            name=$(basename "$f" .xml)
            case "$name" in
              study-recorder) dname="学习记录 V3.1"; oname="学习记录 V3.1.shortcut";;
              study-weekly)   dname="学习周报 V3.1"; oname="学习周报 V3.1.shortcut";;
              *)              dname="$name";        oname="$name.shortcut";;
            esac
            echo "signing $name -> $oname ($dname)"
            curl -sS -m 120 -o "shortcuts/$oname" \
              -F "shortcutName=$dname" \
              -F "shortcut=@$f;type=application/xml" \
              https://hubsign.routinehub.services/sign || true
            if ! head -c 4 "shortcuts/$oname" | grep -qa AEA1; then
              echo "first attempt failed, retry with empty User-Agent"
              curl -sS -m 120 -H "User-Agent:" -o "shortcuts/$oname" \
                -F "shortcutName=$dname" \
                -F "shortcut=@$f;type=application/xml" \
                https://hubsign.routinehub.services/sign
            fi
          done
      - name: Verify and commit
        run: |
          for f in shortcuts/*.shortcut; do
            if head -c 4 "$f" | grep -qa AEA1; then echo "OK $f"; else echo "BAD $f"; exit 1; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shortcuts
          git commit -m "Re-sign shortcuts" || echo "no changes"
          git push
